<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />

    <title>404 — Jared Klopstein</title>
    <meta name="description" content="That page does not exist." />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <style>
      :root {
        --bg-primary: #faf7f2;
        --text-primary: #1a1a1a;
        --text-secondary: #5c5c5c;
        --accent: #0d9488;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-primary: #0b0d10;
          --text-primary: #e8eaed;
          --text-secondary: #a3a8b1;
          --accent: #2dd4bf;
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        font-family: "Source Serif 4", Georgia, serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 42rem;
        width: 100%;
      }

      .label {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.8rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        color: var(--accent);
        margin-bottom: 1rem;
      }

      h1 {
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-bottom: 0.75rem;
      }

      p {
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--text-secondary);
        margin-bottom: 1.75rem;
      }

      a {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.85rem;
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid currentColor;
        padding-bottom: 1px;
      }

      a:hover {
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="label">404</div>
      <h1>That page doesn't exist.</h1>
      <p>Probably a stale link, possibly a typo. Either way, there's nothing here.</p>
      <a href="/">&larr; back home</a>
    </main>
  </body>
</html>
